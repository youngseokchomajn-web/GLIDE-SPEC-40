rationale: "External public-data predictive qualification is blocked by construct mismatch, but substantial pre-sample engineering work remains available. Harden the frozen Rev.8.1 simulator and make first physical validation immediately executable without contaminating the baseline."
required_actions:
  - "Run a red-team audit of Rev.8.1 and preserve the baseline unless a separate ORC-approved change is required."
  - "Verify dataset, feature, preprocessing, artifact hashes, and leakage boundaries used by the current simulator."
  - "Audit GS40 formulation/process feasibility constraints and generate a reproducible feasible/infeasible space report."
  - "Run the authorized large virtual landscape screen and quantify boundary behavior; label all virtual results as non-physical evidence."
  - "Run sensitivity analysis and physical sanity checks across the feasible space; flag implausible behavior rather than silently tuning it away."
  - "Audit uncertainty and OOD behavior across the feasible space and identify high-risk extrapolation regions."
  - "Run Group-CV/conformal diagnostics using only authorized existing data; no external-validation-data tuning and no hypothetical physical-data tuning."
  - "Optimize/rank the first physical pilot DOE or acquisition set using a reproducible information-gain/Pareto rationale; clearly distinguish virtual selection from physical evidence."
  - "Freeze a pre-physical qualification gate record using the existing gates: N_primary>=16, N_center>=3, CV<=4%, LOF p>=0.05, Group-CV R²>=0.85, PI coverage>=85%."
  - "Dry-run the complete physical-data path: raw measurement ingestion -> immutable freeze -> blind prediction -> metrics -> ORC review, without using simulated outcomes as model training targets."
  - "Do not modify Rev.8.1, train, recalibrate, rescale, or tune against external validation data or hypothetical physical outcomes."
  - "Preserve all prior GEM/ORC evidence additively and report any defect or proposed model change as a separate ORC decision item."
acceptance_criteria:
  - "Auditable feasible/infeasible constraint report."
  - "Reproducible virtual landscape and boundary diagnostics."
  - "Sensitivity and physical-sanity evidence with explicit unresolved anomalies if any."
  - "Quantitative uncertainty/OOD map or equivalent diagnostics."
  - "Leakage-safe Group-CV/conformal diagnostics."
  - "Reproducible pilot DOE/acquisition ranking and rationale."
  - "Immutable pre-physical qualification gate record."
  - "Successful end-to-end dry-run of the physical-data ingestion and blind-scoring pipeline."
  - "Rev.8.1 and production qualification status remain unchanged unless a separate ORC decision authorizes otherwise."
  - "All outputs clearly distinguish virtual evidence from physical QC evidence."
